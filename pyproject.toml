[project]
name = "convert-to-stl"
version = "1.0.0"
description = "Native Windows desktop batch conversion from 3D models to STL, processed locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Matt Bateman"}]
keywords = ["stl", "3d-printing", "3mf", "step", "cad", "desktop", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/matt-bat/convert-to-stl"
Repository = "https://github.com/matt-bat/convert-to-stl"
Issues = "https://github.com/matt-bat/convert-to-stl/issues"
Changelog = "https://github.com/matt-bat/convert-to-stl/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
